<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a08" />
    <meta name="description" content="Wedding invitation" />
    <meta property="og:title" content="Wedding Invitation" />
    <meta property="og:description" content="우리의 결혼식에 초대합니다" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Italiana&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Noto+Serif+KR:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
      rel="stylesheet"
    />

    <title>Wedding Invitation &middot; Photo</title>
  </head>
  <body class="theme-dark mode-intro scene-ring" data-variant="photo">
    <div id="loader" class="loader" aria-hidden="true">
      <span class="loader__mark">W</span>
    </div>

    <canvas id="three-canvas" aria-hidden="true"></canvas>

    <main id="app"></main>

    <aside id="tweaks" class="tweaks" aria-label="Live tweaks">
      <button class="tweaks__toggle" type="button" aria-expanded="false" aria-controls="tweaks-panel">
        <span class="tweaks__dot"></span>
        <span class="tweaks__label">Tweaks</span>
      </button>
      <div class="tweaks__panel" id="tweaks-panel" hidden></div>
    </aside>

    <button id="audio-toggle" class="audio-toggle" type="button" aria-pressed="false" aria-label="Toggle music">
      <span class="audio-toggle__bars" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
